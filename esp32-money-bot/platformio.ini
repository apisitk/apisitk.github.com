; PlatformIO build (optional; Arduino IDE works too, open money_bot/money_bot.ino)
[platformio]
src_dir = money_bot

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
